<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THESO · Hero background</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F2F1EC;
    }

    .stage {
      position: absolute;
      inset: 0;
      background: #F2F1EC;
    }

    /* Matches original .hero-bg — sits in lower portion, slightly transparent */
    .flow {
      position: absolute;
      left: 0;
      top: 26%;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0.9;
      pointer-events: none;
    }

    /* Matches original .hero-veil — keeps native Framer text readable */
    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(242, 241, 236, 0.97) 0%,
        rgba(242, 241, 236, 0.90) 40%,
        rgba(242, 241, 236, 0.62) 75%,
        rgba(242, 241, 236, 0.35) 100%
      );
    }

    @media (max-width: 720px) {
      /* Softer on small screens; Framer can also hide this embed entirely */
      .flow { opacity: 0.7; }
      .veil {
        background: linear-gradient(
          180deg,
          rgba(242, 241, 236, 0.98) 0%,
          rgba(242, 241, 236, 0.94) 45%,
          rgba(242, 241, 236, 0.78) 100%
        );
      }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <iframe
      class="flow"
      src="./market-flow/index.html"
      title="Market flow background"
      loading="eager"
      tabindex="-1"
    ></iframe>
    <div class="veil"></div>
  </div>
</body>
</html>
