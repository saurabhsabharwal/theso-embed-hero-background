<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theso — Market flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--stone:#F2F1EC;--paper:#FFFFFF;--ink:#14140F;--muted:#8B897F;--faint:#B9B7AE;--line:#E5E4DC;--green:#0E8F5E;--red:#C13030}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--stone)}
  body{font-family:'Sora',sans-serif}
  .stage{position:absolute;left:0;top:0;width:1600px;height:1400px;transform-origin:0 0;overflow:hidden;background:var(--stone);perspective:2400px;perspective-origin:50% 20%}
  .plane{position:absolute;top:-40px;left:50%;width:2600px;margin-left:-790px;transform:rotateX(26deg) rotateZ(-8deg) scale(1.05);transform-origin:50% 0}
  .scroll{animation:flow 110s linear infinite;will-change:transform;background:var(--paper)}
  @keyframes flow{from{transform:translateY(0)}to{transform:translateY(-50%)}}
  @media (prefers-reduced-motion: reduce){.scroll{animation:none}}

  .row{display:grid;grid-template-columns:64px 290px 130px 105px 155px 155px 155px 1fr;align-items:center;gap:26px;padding:16px 34px;border-bottom:1px solid #DCDBD2;background:var(--paper)}
  .row:nth-child(odd){background:#F7F6F1}
  .chip{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--stone);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
  .nm{min-width:0}
  .nm b{display:block;font-size:21px;font-weight:600;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nm span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  .px,.pc{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--ink);text-align:right;white-space:nowrap}
  .pc{font-weight:600}
  .pc.up{color:var(--green)}
  .pc.dn{color:var(--red)}
  .ag{display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
  .ag .al{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
  .ag .av{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--green)}
  .ag .av.dn{color:var(--red)}
  .ag .at{height:3.5px;background:#E8E7DF;border-radius:2px;overflow:hidden;max-width:120px}
  .ag .at i{display:block;height:100%;background:var(--green);border-radius:2px}
  .ag .at i.dn{background:var(--red)}
  .sig{display:flex;align-items:center;gap:12px;min-width:0}
  .bars{display:flex;align-items:flex-end;gap:2.5px;height:16px;flex-shrink:0}
  .bars i{width:3.5px;border-radius:2px;background:var(--green);display:block}
  .bars.dn i{background:var(--red)}
  .bars i:nth-child(1){height:38%}.bars i:nth-child(2){height:66%}.bars i:nth-child(3){height:100%}
  .sc{font-family:'JetBrains Mono',monospace;font-size:14.5px;font-weight:600;flex-shrink:0}
  .sc.up{color:var(--green)}.sc.dn{color:var(--red)}
  .cm{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flash-up{animation:fup 1.4s ease-out}
  .flash-dn{animation:fdn 1.4s ease-out}
  @keyframes fup{0%{background:rgba(14,143,94,.3)}100%{background:transparent}}
  @keyframes fdn{0%{background:rgba(193,48,48,.26)}100%{background:transparent}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="plane"><div class="scroll" id="scroll"></div></div>
</div>

<script>
(function(){
  var S=[
    ['Apple Inc.','AAPL','NASDAQ',189.30,'2.96T','$71.2k',-0.18,'Component orders softening into H2'],
    ['Microsoft Corp.','MSFT','NASDAQ',421.87,'3.16T','$83.0k',2.76,'Copilot attach accelerating in enterprise'],
    ['NVIDIA Corp.','NVDA','NASDAQ',897.35,'2.21T','$26.3k',4.88,'AI compute demand broadening'],
    ['Amazon.com Inc.','AMZN','NASDAQ',182.26,'1.91T','$36.5k',0.48,'AWS re-acceleration in view'],
    ['Alphabet Inc.','GOOGL','NASDAQ',173.09,'2.14T','$29.8k',-0.82,'Ad pricing power returning slowly'],
    ['Meta Platforms','META','NASDAQ',501.68,'1.30T','$61.1k',0.43,'Reels monetisation narrowing gap'],
    ['Tesla Inc.','TSLA','NASDAQ',186.28,'594B','$44.9k',6.26,'Energy storage bookings surge'],
    ['Netflix Inc.','NFLX','NASDAQ',620.63,'271B','$18.9k',-0.31,'Ad tier subs ahead of plan'],
    ['Broadcom Inc.','AVGO','NASDAQ',1412.50,'655B','$22.4k',3.18,'Custom silicon pipeline widening'],
    ['Eli Lilly & Co.','LLY','NYSE',792.04,'752B','$14.7k',1.92,'GLP-1 supply constraints easing'],
    ['JPMorgan Chase','JPM','NYSE',198.47,'571B','$40.2k',0.64,'NIM guidance steady on the call'],
    ['Exxon Mobil','XOM','NYSE',114.88,'456B','$31.5k',-1.04,'Crude spread compressing at Cushing'],
    ['Visa Inc.','V','NYSE',276.34,'562B','$19.6k',0.22,'Cross-border volume holding up'],
    ['Johnson & Johnson','JNJ','NYSE',147.52,'355B','$16.8k',-0.12,'Litigation overhang stabilising'],
    ['UnitedHealth','UNH','NYSE',492.10,'453B','$12.4k',0.87,'Cost trend normalising post-cyber'],
    ['Mastercard','MA','NYSE',449.77,'418B','$11.9k',0.35,'Value-added services outpacing core'],
    ['Procter & Gamble','PG','NYSE',166.21,'392B','$14.1k',0.09,'Volume growth back to positive'],
    ['Costco Wholesale','COST','NASDAQ',837.45,'371B','$9.8k',1.14,'Membership fee lift on the table'],
    ['Merck & Co.','MRK','NYSE',128.93,'326B','$13.6k',-0.44,'Keytruda LOE planning in focus'],
    ['AbbVie Inc.','ABBV','NYSE',171.06,'302B','$12.2k',0.51,'Immunology franchise re-rating'],
    ['Advanced Micro','AMD','NASDAQ',162.40,'262B','$38.7k',3.52,'MI300 ramp ahead of plan'],
    ['Salesforce Inc.','CRM','NYSE',272.90,'264B','$15.3k',-1.21,'Agentforce pilots converting slowly'],
    ['Adobe Inc.','ADBE','NASDAQ',524.16,'233B','$10.7k',0.77,'Firefly usage inflecting in creative'],
    ['PepsiCo Inc.','PEP','NASDAQ',176.35,'242B','$11.4k',-0.28,'Snacking volumes soft in NA'],
    ['Coca-Cola Co.','KO','NYSE',62.48,'269B','$17.2k',0.18,'Pricing carry-over fading gently'],
    ['Walmart Inc.','WMT','NYSE',68.72,'553B','$21.6k',0.93,'Grocery share gains persisting'],
    ['Oracle Corp.','ORCL','NYSE',139.84,'384B','$13.9k',2.05,'OCI backlog building with AI deals'],
    ['Intel Corp.','INTC','NASDAQ',30.94,'132B','$47.3k',-2.13,'Foundry losses wider than modelled'],
    ['Qualcomm Inc.','QCOM','NASDAQ',201.55,'225B','$16.4k',1.66,'On-device AI design wins stacking'],
    ['Texas Instruments','TXN','NASDAQ',195.29,'178B','$8.9k',-0.57,'Analog inventory digestion continues'],
    ['ASML Holding','ASML','NASDAQ',962.30,'386B','$6.7k',2.41,'EUV order book firming for 2027'],
    ['Taiwan Semi.','TSM','NYSE',158.71,'823B','$28.4k',3.05,'Monthly revenue print +14% y/y'],
    ['Berkshire Hath. B','BRK.B','NYSE',412.63,'890B','$9.2k',0.14,'Cash pile at record into the print'],
    ['Home Depot','HD','NYSE',342.18,'339B','$8.6k',-0.36,'Big-ticket remodel demand deferred'],
    ['McDonald\u2019s Corp.','MCD','NYSE',258.94,'187B','$7.8k',0.27,'Value menu traffic stabilising'],
    ['Walt Disney Co.','DIS','NYSE',101.36,'184B','$18.7k',-0.73,'DTC profitability milestone near'],
    ['Nike Inc.','NKE','NYSE',76.42,'115B','$22.1k',-1.48,'Freight re-routing costs building'],
    ['Boeing Co.','BA','NYSE',178.55,'109B','$19.4k',0.88,'Delivery cadence recovering slowly'],
    ['Caterpillar Inc.','CAT','NYSE',334.87,'163B','$6.4k',0.59,'Dealer inventories normalising'],
    ['Goldman Sachs','GS','NYSE',441.20,'142B','$5.9k',1.02,'Trading revenue beat, IB pipeline up'],
    ['Morgan Stanley','MS','NYSE',97.64,'159B','$11.3k',0.46,'Wealth net-new assets re-accelerating'],
    ['Chevron Corp.','CVX','NYSE',154.29,'284B','$13.1k',-0.61,'Permian output guidance trimmed'],
    ['Pfizer Inc.','PFE','NYSE',27.83,'158B','$41.6k',-0.94,'Pipeline reset year, cost cuts on track'],
    ['Thermo Fisher','TMO','NYSE',589.42,'225B','$4.7k',0.33,'Bioprocessing orders bottoming'],
    ['Linde plc','LIN','NASDAQ',441.06,'212B','$3.9k',0.21,'Clean hydrogen backlog compounding'],
    ['SAP SE','SAP','NYSE',196.40,'229B','$5.2k',1.37,'Cloud margin up, ad rev steady on call'],
    ['Novo Nordisk','NVO','NYSE',131.77,'587B','$16.9k',2.18,'Wegovy capacity additions on schedule'],
    ['Shell plc','SHEL','NYSE',72.15,'227B','$12.8k',-0.39,'Gas trading strength offsetting downstream'],
    ['Toyota Motor','TM','NYSE',201.88,'274B','$4.4k',0.72,'Hybrid mix lifting margins again'],
    ['Vertiv Holdings','VRT','NYSE',94.36,'36B','$25.7k',5.11,'Data-centre cooling orders approved']
  ];
  function fmt(p){return '$'+p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function sent(base,i,k){var off=Math.sin((i+1)*(k+2)*7.13)*0.38;var v=base/5+off;return Math.max(-0.92,Math.min(0.95,Math.round(v*100)/100));}
  function ss(v){return (v>=0?'+':'\u2212')+Math.abs(v).toFixed(2);}
  var AGENTS=['Earnings Agent','Search Agent','Rivals Agent'];
  function agCell(s,i,k){var v=sent(s[6],i,k);var up=v>=0;return '<div class="ag"><span class="al">'+AGENTS[k]+'</span><span class="av'+(up?'':' dn')+'" data-f="a'+k+'">'+ss(v)+'</span><span class="at"><i class="'+(up?'':'dn')+'" style="width:'+Math.round(Math.abs(v)*100)+'%" data-f="t'+k+'"></i></span></div>';}
  function pcs(v){return (v>=0?'+':'\u2212')+Math.abs(v).toFixed(2)+'%';}
  function rowHTML(s,i){
    var up=s[6]>=0;
    return '<div class="row" data-i="'+i+'">'+
      '<div class="chip">'+s[1]+'</div>'+
      '<div class="nm"><b>'+s[0]+'</b><span>'+s[1]+' \u00b7 '+s[2]+'</span></div>'+
      '<div class="px" data-f="px">'+fmt(s[3])+'</div>'+
      '<div class="pc '+(up?'up':'dn')+'" data-f="pc">'+pcs(s[6])+'</div>'+
      agCell(s,i,0)+agCell(s,i,1)+agCell(s,i,2)+
      '<div class="sig"><span class="bars'+(up?'':' dn')+'" data-f="bars"><i></i><i></i><i></i></span><span class="sc '+(up?'up':'dn')+'" data-f="sc">'+pcs(s[6]).replace('%','')+'</span><span class="cm">'+s[7]+'</span></div>'+
    '</div>';
  }
  var html='';
  for(var i=0;i<S.length;i++)html+=rowHTML(S[i],i);
  document.getElementById('scroll').innerHTML=html+html; // duplicate for seamless loop

  // Live updates — one full row refresh every 1.5s
  var CM_UP=['Guidance raised, structurally','Order book firming into Q3','Search demand inflecting w/w','Channel checks turning positive','Backlog building with AI deals','Consensus revising higher','Volume growth back to positive','Pricing power returning','Capacity additions on schedule','Insider buying cluster noted'],
      CM_DN=['Guidance hedged on the call','Inventory digestion continues','Search interest fading w/w','Channel checks softening','Margin pressure flagged','Consensus drifting lower','Volume trend rolling over','Discounting widening in-channel','Supply constraints re-emerging','Insider selling cluster noted'];
  setInterval(function(){
    // pick a row currently in view: derive scroll offset from animation progress
    var sc0=document.getElementById('scroll');
    var half=sc0.scrollHeight/2;
    var off=(performance.now()/110000*half)%half;
    var rowH=half/S.length;
    var y=150+Math.random()*1800;
    var i=Math.floor((off+y)/rowH)%S.length;
    var s=S[i];
    var d=(Math.random()-0.45)*1.6;
    s[6]=Math.round((s[6]+d)*100)/100;
    s[3]=Math.round(s[3]*(1+d/100)*100)/100;
    var up=s[6]>=0;
    s[7]=(d>=0?CM_UP:CM_DN)[Math.floor(Math.random()*10)];
    document.querySelectorAll('.row[data-i="'+i+'"]').forEach(function(r){
      r.querySelector('[data-f="px"]').textContent=fmt(s[3]);
      var pc=r.querySelector('[data-f="pc"]');
      pc.textContent=pcs(s[6]);pc.className='pc '+(up?'up':'dn');
      var sc=r.querySelector('[data-f="sc"]');
      sc.textContent=pcs(s[6]).replace('%','');sc.className='sc '+(up?'up':'dn');
      r.querySelector('[data-f="bars"]').className='bars'+(up?'':' dn');
      r.querySelector('.cm').textContent=s[7];
      for(var k=0;k<3;k++){var av=sent(s[6],i,k);var aup=av>=0;var ael=r.querySelector('[data-f="a'+k+'"]');if(ael){ael.textContent=ss(av);ael.className='av'+(aup?'':' dn');}var tel=r.querySelector('[data-f="t'+k+'"]');if(tel){tel.style.width=Math.round(Math.abs(av)*100)+'%';tel.className=aup?'':'dn';}}
      r.classList.remove('flash-up','flash-dn');
      void r.offsetWidth;
      r.classList.add(d>=0?'flash-up':'flash-dn');
    });
  },1500);

  // Scale fixed 1600x1400 stage to viewport
  function fit(){
    var st=document.getElementById('stage');
    var k=window.innerWidth/1600;
    st.style.transform='scale('+k+')';
    document.body.style.height=(1400*k)+'px';
  }
  fit();window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
